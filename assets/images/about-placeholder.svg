<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e8e8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1F3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2f4d;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="600" fill="url(#aboutBg)"/>

  <!-- Sky -->
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#E0FFFF;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  <rect width="500" height="250" fill="url(#sky)"/>

  <!-- Sun/Light Effect -->
  <circle cx="420" cy="80" r="40" fill="#FFD700" opacity="0.15"/>
  <circle cx="420" cy="80" r="35" fill="#FFC700" opacity="0.1"/>

  <!-- Building Shadow -->
  <g transform="translate(250, 320)">
    <!-- Building Main Structure -->
    <rect x="-120" y="0" width="240" height="200" fill="url(#buildingGrad)" stroke="#C9A227" stroke-width="2"/>

    <!-- Roof -->
    <polygon points="-120,0 0,-50 120,0" fill="#C9A227"/>
    
    <!-- Decorative Top Line -->
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#E5C76B" stroke-width="1.5" opacity="0.6"/>

    <!-- Windows - Left Wing -->
    <g id="windowGroup">
      <!-- Row 1 -->
      <rect x="-110" y="20" width="25" height="25" fill="#FAF8F2" stroke="#C9A227" stroke-width="1.5" opacity="0.8"/>
      <line x1="-110" y1="32.5" x2="-85" y2="32.5" stroke="#C9A227" stroke-width="0.8"/>
      <line x1="-97.5" y1="20" x2="-97.5" y2="45" stroke="#C9A227" stroke-width="0.8"/>

      <rect x="-75" y="20" width="25" height="25" fill="#FAF8F2" stroke="#C9A227" stroke-width="1.5" opacity="0.8"/>
      <line x1="-75" y1="32.5" x2="-50" y2="32.5" stroke="#C9A227" stroke-width="0.8"/>
      <line x1="-62.5" y1="20" x2="-62.5" y2="45" stroke="#C9A227" stroke-width="0.8"/>

      <!-- Row 2 -->
      <rect x="-110" y="60" width="25" height="25" fill="#0B1F3A" stroke="#C9A227" stroke-width="1.5" opacity="0.9"/>
      <line x1="-110" y1="72.5" x2="-85" y2="72.5" stroke="#E5C76B" stroke-width="0.8" opacity="0.5"/>
      <line x1="-97.5" y1="60" x2="-97.5" y2="85" stroke="#E5C76B" stroke-width="0.8" opacity="0.5"/>

      <rect x="-75" y="60" width="25" height="25" fill="#0B1F3A" stroke="#C9A227" stroke-width="1.5" opacity="0.9"/>
      <line x1="-75" y1="72.5" x2="-50" y2="72.5" stroke="#E5C76B" stroke-width="0.8" opacity="0.5"/>
      <line x1="-62.5" y1="60" x2="-62.5" y2="85" stroke="#E5C76B" stroke-width="0.8" opacity="0.5"/>

      <!-- Row 3 -->
      <rect x="-110" y="100" width="25" height="25" fill="#FAF8F2" stroke="#C9A227" stroke-width="1.5" opacity="0.8"/>
      <rect x="-75" y="100" width="25" height="25" fill="#FAF8F2" stroke="#C9A227" stroke-width="1.5" opacity="0.8"/>
    </g>

    <!-- Windows - Center & Right Wing (Mirror) -->
    <g transform="scaleX(-1)">
      <rect x="-110" y="20" width="25" height="25" fill="#FAF8F2" stroke="#C9A227" stroke-width="1.5" opacity="0.8"/>
      <rect x="-75" y="20" width="25" height="25" fill="#FAF8F2" stroke="#C9A227" stroke-width="1.5" opacity="0.8"/>
      <rect x="-110" y="60" width="25" height="25" fill="#0B1F3A" stroke="#C9A227" stroke-width="1.5" opacity="0.9"/>
      <rect x="-75" y="60" width="25" height="25" fill="#0B1F3A" stroke="#C9A227" stroke-width="1.5" opacity="0.9"/>
      <rect x="-110" y="100" width="25" height="25" fill="#FAF8F2" stroke="#C9A227" stroke-width="1.5" opacity="0.8"/>
      <rect x="-75" y="100" width="25" height="25" fill="#FAF8F2" stroke="#C9A227" stroke-width="1.5" opacity="0.8"/>
    </g>

    <!-- Center Door -->
    <rect x="-35" y="120" width="30" height="70" fill="#061426" stroke="#C9A227" stroke-width="2"/>
    <circle cx="-20" cy="155" r="3" fill="#E5C76B"/>
    <line x1="-35" y1="155" x2="-5" y2="155" stroke="#C9A227" stroke-width="1" opacity="0.5"/>

    <!-- Base/Foundation -->
    <rect x="-120" y="200" width="240" height="15" fill="#061426" stroke="#C9A227" stroke-width="1.5"/>
    <line x1="-120" y1="207.5" x2="120" y2="207.5" stroke="#C9A227" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Decorative Elements -->
  <!-- Left Trees -->
  <g transform="translate(80, 420)">
    <!-- Tree trunk -->
    <rect x="-8" y="0" width="16" height="50" fill="#8B7355"/>
    <!-- Tree top -->
    <circle cx="0" cy="0" r="35" fill="#2D5016"/>
    <circle cx="-20" cy="10" r="30" fill="#3A6B2E"/>
    <circle cx="20" cy="10" r="30" fill="#3A6B2E"/>
  </g>

  <!-- Right Trees -->
  <g transform="translate(420, 420)">
    <!-- Tree trunk -->
    <rect x="-8" y="0" width="16" height="50" fill="#8B7355"/>
    <!-- Tree top -->
    <circle cx="0" cy="0" r="35" fill="#2D5016"/>
    <circle cx="-20" cy="10" r="30" fill="#3A6B2E"/>
    <circle cx="20" cy="10" r="30" fill="#3A6B2E"/>
  </g>

  <!-- Bottom grass -->
  <ellipse cx="250" cy="580" rx="250" ry="30" fill="#90EE90" opacity="0.3"/>

  <!-- Text Overlay -->
  <text x="250" y="550" font-family="'Playfair Display', serif" font-size="20" font-weight="700" text-anchor="middle" fill="#0B1F3A">
    Excellence in Education
  </text>
</svg>