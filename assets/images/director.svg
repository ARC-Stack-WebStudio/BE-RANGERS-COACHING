<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600">
  <defs>
    <linearGradient id="directorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e8e8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="faceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5A794;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E89679;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="600" fill="url(#directorBg)"/>

  <!-- Top Accent Bar -->
  <rect width="500" height="10" fill="#C9A227"/>

  <!-- Profile Background -->
  <circle cx="250" cy="200" r="130" fill="#0B1F3A" stroke="#C9A227" stroke-width="4"/>

  <!-- Head -->
  <circle cx="250" cy="160" r="80" fill="url(#faceBg)"/>

  <!-- Hair -->
  <path d="M 170 160 Q 160 120 180 80 Q 210 40 250 35 Q 290 40 320 80 Q 340 120 330 160" fill="#2D2D2D"/>

  <!-- Face Details -->
  <!-- Eyes -->
  <circle cx="230" cy="150" r="6" fill="#333"/>
  <circle cx="270" cy="150" r="6" fill="#333"/>
  <circle cx="231" cy="148" r="2.5" fill="#fff" opacity="0.7"/>
  <circle cx="271" cy="148" r="2.5" fill="#fff" opacity="0.7"/>

  <!-- Eyebrows -->
  <path d="M 222 140 Q 230 135 238 138" stroke="#2D2D2D" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 262 138 Q 270 135 278 140" stroke="#2D2D2D" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <line x1="250" y1="145" x2="250" y2="165" stroke="#C99A69" stroke-width="2"/>
  <circle cx="245" cy="167" r="3" fill="#C99A69"/>
  <circle cx="255" cy="167" r="3" fill="#C99A69"/>

  <!-- Mouth -->
  <path d="M 235 175 Q 250 182 265 175" stroke="#B8845F" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="230" y="235" width="40" height="35" fill="url(#faceBg)"/>

  <!-- Professional Suit/Formal Wear -->
  <g>
    <!-- Shirt -->
    <path d="M 170 270 L 250 280 L 330 270 L 330 350 L 170 350 Z" fill="#FFFFFF"/>
    
    <!-- Tie -->
    <path d="M 245 280 L 240 350 L 255 340 L 260 280 Z" fill="#C9A227" stroke="#8B7F1F" stroke-width="1.5"/>
    <circle cx="250" cy="290" r="4" fill="#8B7F1F" opacity="0.5"/>
    
    <!-- Blazer Left -->
    <path d="M 170 270 L 200 280 L 200 450 L 150 450 Z" fill="#1a1a1a" opacity="0.8"/>
    
    <!-- Blazer Right -->
    <path d="M 330 270 L 300 280 L 300 450 L 350 450 Z" fill="#1a1a1a" opacity="0.8"/>
    
    <!-- Blazer Shoulders -->
    <path d="M 170 270 Q 210 260 250 260 Q 290 260 330 270" fill="#1a1a1a" opacity="0.85"/>
  </g>

  <!-- Status Badge -->
  <circle cx="420" cy="80" r="45" fill="#C9A227" stroke="#FFD700" stroke-width="3"/>
  <text x="420" y="75" font-family="'Playfair Display', serif" font-size="20" font-weight="700" text-anchor="middle" fill="#0B1F3A">
    DIRECTOR
  </text>
  <text x="420" y="95" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0B1F3A" letter-spacing="0.5">
    &amp; FOUNDER
  </text>

  <!-- Name Section -->
  <g transform="translate(250, 480)">
    <text x="0" y="0" font-family="'Playfair Display', serif" font-size="26" font-weight="700" text-anchor="middle" fill="#0B1F3A" letter-spacing="1">
      Mr. Ashutosh Dhawar
    </text>
    <text x="0" y="30" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#C9A227" letter-spacing="1" text-transform="uppercase">
      M.Tech, MBA - Education Management
    </text>
  </g>

  <!-- Bottom Accent -->
  <rect y="590" width="500" height="10" fill="#C9A227"/>

  <!-- Decorative Elements -->
  <circle cx="30" cy="50" r="5" fill="#C9A227" opacity="0.3"/>
  <circle cx="470" cy="550" r="6" fill="#C9A227" opacity="0.2"/>
</svg>