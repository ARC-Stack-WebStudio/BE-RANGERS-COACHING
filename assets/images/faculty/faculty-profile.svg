<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="faceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDBCB4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5A794;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f8f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="400" height="500" fill="url(#cardBg)" rx="15"/>
  <rect width="400" height="280" fill="#0B1F3A" rx="15"/>

  <!-- Decorative Top Bar -->
  <rect width="400" height="8" fill="#C9A227"/>

  <!-- Profile Area -->
  <g transform="translate(200, 140)">
    <!-- Head -->
    <circle cx="0" cy="-30" r="50" fill="url(#faceBg)"/>
    
    <!-- Hair -->
    <path d="M -50 -30 Q -60 -50 -40 -70 Q -20 -80 0 -82 Q 20 -80 40 -70 Q 60 -50 50 -30" fill="#2D2D2D"/>
    
    <!-- Face Details -->
    <!-- Eyes -->
    <circle cx="-18" cy="-40" r="5" fill="#333"/>
    <circle cx="18" cy="-40" r="5" fill="#333"/>
    <circle cx="-17" cy="-40" r="2" fill="#fff" opacity="0.6"/>
    <circle cx="19" cy="-40" r="2" fill="#fff" opacity="0.6"/>
    
    <!-- Eyebrows -->
    <path d="M -25 -48 Q -18 -50 -12 -48" stroke="#2D2D2D" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 12 -48 Q 18 -50 25 -48" stroke="#2D2D2D" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Nose -->
    <line x1="0" y1="-35" x2="0" y2="-18" stroke="#D4A574" stroke-width="1.5"/>
    <circle cx="-5" cy="-15" r="2.5" fill="#D4A574"/>
    <circle cx="5" cy="-15" r="2.5" fill="#D4A574"/>
    
    <!-- Mouth -->
    <path d="M -15 -8 Q 0 -2 15 -8" stroke="#C9A788" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Neck -->
    <rect x="-20" y="20" width="40" height="25" fill="url(#faceBg)"/>
    
    <!-- Shoulders/Clothing -->
    <path d="M -40 45 L -30 70 L 30 70 L 40 45 Z" fill="#0B1F3A"/>
    <path d="M -35 45 L -25 48 L -20 60 L -15 50 L 0 52 L 15 50 L 20 60 L 25 48 L 35 45" fill="#C9A227" opacity="0.8"/>
  </g>

  <!-- Name Section (placeholder) -->
  <g transform="translate(200, 320)">
    <text x="0" y="0" font-family="'Playfair Display', serif" font-size="22" font-weight="700" text-anchor="middle" fill="#0B1F3A">
      Faculty Member
    </text>
    <text x="0" y="30" font-family="'Poppins', sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#C9A227" letter-spacing="0.5">
      SUBJECT SPECIALIST
    </text>
  </g>

  <!-- Info Section -->
  <g transform="translate(200, 400)">
    <rect x="-140" y="0" width="280" height="75" fill="#FAF8F2" rx="8" opacity="0.8"/>
    
    <text x="0" y="20" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0B1F3A" letter-spacing="0.3" text-transform="uppercase">
      Experience & Expertise
    </text>
    
    <text x="0" y="40" font-family="'Poppins', sans-serif" font-size="10" text-anchor="middle" fill="#64748B">
      B.Sc, M.Sc from Premier Institute
    </text>
    
    <text x="0" y="55" font-family="'Poppins', sans-serif" font-size="10" text-anchor="middle" fill="#64748B">
      10+ Years Teaching Experience
    </text>
  </g>

  <!-- Decorative Elements -->
  <circle cx="380" cy="20" r="8" fill="#C9A227" opacity="0.3"/>
  <circle cx="20" cy="480" r="6" fill="#C9A227" opacity="0.2"/>
</svg>